function mapsRouteUrl(route){
  if (!route || route.length < 2) return '';
  const pts = [...route];
  const origin = pts.shift();
  const destination = pts.pop();
  const params = new URLSearchParams({ api:'1', travelmode:'transit', origin, destination });
  if (pts.length) params.set('waypoints', pts.join('|'));
  return `https://www.google.com/maps/dir/?${params.toString()}`;
}

function transportSummary(d){
  const legRoutes = d.legRoutes || {};
  const legs = d.poi
    .map((p, i) => ({ p, step: d.steps[i], i }))
    .filter(({p, step}) => p[1] === "Traslado" && step);
  if (!legs.length) return '';
  const routeMap = (d.route && d.route.length >= 2) ? `
    <div class="mt-4">
      <p class="font-label-caps text-[11px] text-ink-subtle mb-2">MAPA DEL DÍA — ${d.route.length} paradas</p>
      <div id="dayMapContainer" class="w-full h-72 rounded-lg border border-outline-variant/20 bg-surface-variant flex items-center justify-center text-xs text-ink-subtle">Cargando mapa…</div>
    </div>` : '';
  return `
    <section class="px-6 mb-6 reveal">
      <div class="bg-surface-container-lowest p-5 rounded-xl shadow-sm border border-outline-variant/10">
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined text-secondary">train</span>
          <h3 class="font-headline-md text-body-lg font-bold text-primary">Cómo moverte hoy</h3>
        </div>
        <div class="space-y-3">
          ${legs.map(({p, step, i}) => {
            const legUrl = mapsRouteUrl(legRoutes[i]);
            return `
            <div class="flex gap-3 items-start">
              <span class="font-label-caps text-[11px] text-ink-subtle w-10 flex-none pt-0.5">${step[0]}</span>
              <div>
                <p class="text-sm text-on-surface-variant"><span class="font-bold text-on-surface">${p[2]}</span> — ${p[3]}</p>
                ${legUrl ? `<a href="${legUrl}" target="_blank" rel="noopener" class="text-[11px] font-bold text-secondary">📍 Ver este tramo en Google Maps</a>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
        ${routeMap}
      </div>
    </section>`;
}

function mapsSearchUrl(place){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
}

let currentDayMap = null;
const geocodeCache = {};

async function geocodePlace(query){
  if (KNOWN_PLACES[query]) return KNOWN_PLACES[query];
  if (geocodeCache[query]) return geocodeCache[query];
  // Respaldo para cualquier lugar que no esté en KNOWN_PLACES (no debería
  // pasar con el itinerario actual, pero cubre nuevos lugares a futuro).
  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?limit=1&country=jp&proximity=139.6917,35.6895&access_token=${mapboxgl.accessToken}`;
  const res = await fetch(url);
  const data = await res.json();
  const coords = (data.features && data.features[0]) ? data.features[0].center : null;
  geocodeCache[query] = coords;
  return coords;
}

function dayMapMarkerEl(label, kind){
  const el = document.createElement('div');
  el.style.width = '26px';
  el.style.height = '26px';
  el.style.borderRadius = '50%';
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'center';
  el.style.fontSize = '12px';
  el.style.fontWeight = 'bold';
  el.style.color = '#fff';
  el.style.border = '2px solid #fff';
  el.style.boxShadow = '0 1px 4px rgba(0,0,0,0.35)';
  el.style.background = kind === 'start' ? '#2a2521' : (kind === 'end' ? '#aa3529' : '#7e756f');
  el.style.cursor = 'pointer';
  if (kind === 'start') {
    el.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">flag</span>';
  } else if (kind === 'end') {
    el.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">location_on</span>';
  } else {
    el.textContent = label;
  }
  return el;
}

async function renderDayMap(d){
  if (currentDayMap) { currentDayMap.remove(); currentDayMap = null; }
  if (!d.route || d.route.length < 2) return;
  const requestedDay = d.key;

  try {
    const coords = await Promise.all(d.route.map(q => geocodePlace(q)));
    if (activeDay !== requestedDay) return;
    const stops = d.route
      .map((label, idx) => ({ label, coord: coords[idx] }))
      .filter(s => s.coord);
    if (stops.length < 2) return;

    const coordStr = stops.map(s => `${s.coord[0]},${s.coord[1]}`).join(';');
    const dirUrl = `https://api.mapbox.com/directions/v5/mapbox/driving/${coordStr}?geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`;
    const dirRes = await fetch(dirUrl);
    const dirData = await dirRes.json();
    if (activeDay !== requestedDay) return;
    const routeGeo = (dirData.routes && dirData.routes[0]) ? dirData.routes[0].geometry : null;

    const container = document.getElementById('dayMapContainer');
    if (!container) return;
    container.textContent = '';

    const map = new mapboxgl.Map({
      container,
      style: 'mapbox://styles/mapbox/light-v11',
      center: stops[0].coord,
      zoom: 10,
      pitch: 65,
      bearing: -20,
    });
    currentDayMap = map;
    map.addControl(new mapboxgl.NavigationControl({ showCompass: true, visualizePitch: true }), 'top-right');

    map.on('load', () => {
      const labelLayer = map.getStyle().layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field']);
      map.addLayer({
        id: '3d-buildings', source: 'composite', 'source-layer': 'building',
        filter: ['==', 'extrude', 'true'], type: 'fill-extrusion', minzoom: 12,
        paint: {
          'fill-extrusion-color': '#c9bfa8',
          'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 12, 0, 15.5, ['get', 'height']],
          'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], 12, 0, 15.5, ['get', 'min_height']],
          'fill-extrusion-opacity': 0.75,
        },
      }, labelLayer ? labelLayer.id : undefined);

      if (routeGeo) {
        map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: routeGeo, properties: {} } });
        map.addLayer({
          id: 'route-line-casing', type: 'line', source: 'route',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#ffffff', 'line-width': 7 },
        });
        map.addLayer({
          id: 'route-line', type: 'line', source: 'route',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#aa3529', 'line-width': 4 },
        });
      }

      const bounds = new mapboxgl.LngLatBounds();
      stops.forEach((s, i) => {
        const kind = i === 0 ? 'start' : (i === stops.length - 1 ? 'end' : 'stop');
        const el = dayMapMarkerEl(String(i + 1), kind);
        new mapboxgl.Marker({ element: el })
          .setLngLat(s.coord)
          .setPopup(new mapboxgl.Popup({ offset: 16 }).setText(s.label.split(',')[0]))
          .addTo(map);
        bounds.extend(s.coord);
      });
      map.fitBounds(bounds, { padding: 40, maxZoom: 16 });

      const hint = document.createElement('div');
      hint.textContent = 'Arrastra con el botón derecho (o dos dedos) para rotar el mapa';
      hint.style.cssText = 'position:absolute;left:8px;bottom:8px;z-index:1;padding:4px 8px;font-size:11px;line-height:1.2;color:#fff;background:rgba(21,16,13,.65);border-radius:6px;pointer-events:none;transition:opacity .6s ease;max-width:80%;';
      container.style.position = 'relative';
      container.appendChild(hint);
      setTimeout(() => { hint.style.opacity = '0'; setTimeout(() => hint.remove(), 600); }, 3500);
    });
  } catch (err) {
    console.error('No se pudo cargar el mapa de Mapbox', err);
  }
}

        <span class="material-symbols-outlined text-ink-subtle transition-transform group-open:rotate-180">expand_more</span>
      </summary>
      <div class="space-y-3 pb-3">
        ${items.map(([name, desc, mapsQuery]) => `

        </div>
        ${section('Desayuno', 'coffee', zone.breakfast)}

}

function photoBento(d){
  const imgs = (d.photos || []).slice(0, 6).map((caption, i) => {
    const src = `images/${d.key}/${i+1}.jpg`;
    return { caption, src };
  });
  if (!imgs.length) return '';
  // layout pattern: first = wide (col-span-2), then pairs of squares, occasional wide every 4th
  let html = '';
  imgs.forEach((img, i) => {
    const wide = (i === 0) || (i % 4 === 3);
    html += `
      <div class="${wide ? 'col-span-2 aspect-[2/1]' : 'aspect-square'} rounded-xl overflow-hidden shadow-sm relative group">
        <img class="w-full h-full object-cover" src="${img.src}" alt="${img.caption}"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div style="display:none" class="w-full h-full items-center justify-center bg-surface-variant text-ink-subtle text-xs text-center p-2">${img.caption}</div>
      </div>`;
  });
  return html;
}

function renderDay(){
  const d = dayData.find(x => x.key === activeDay);
  const wrap = document.getElementById('dayContent');

  const goshuinCount = d.poi.filter(p => p[1] === "Templo" || p[1] === "Santuario").length;
  const optionalCount = (d.optional || []).length;
  const goshuinBadge = (goshuinCount > 0 || optionalCount > 0) ? `
    <div class="bg-goshuin-bg p-4 rounded-xl border border-goshuin-gold/30 flex gap-3 items-center mt-4">

  const noteBadge = d.note ? `

  const timeline = d.steps.map((step, i) => {

    const curiosities = (poiItem && poiItem[4]) ? poiItem[4].map(([ctitle, ctext]) => `

    return `

        <span class="material-symbols-outlined ${style.text} !text-base">${style.icon}</span>
      </div>
      <div class="bg-surface-container-lowest p-5 rounded-xl shadow-sm border border-outline-variant/10 hover:shadow-md transition-shadow">
        <div class="flex justify-between items-center mb-2">
          <span class="font-label-caps text-label-caps text-ink-subtle">${step[0]}</span>

  }).join('');

  const optionalHtml = (d.optional && d.optional.length) ? `
    <section class="px-6 py-8 reveal">

  wrap.innerHTML = `

      <div class="space-y-0 lg:max-w-2xl">${timeline}</div>
    </section>

    ${optionalHtml}
  `;

  initRevealObserver();
}

let revealObserver = null;
function initRevealObserver(){
  if (revealObserver) revealObserver.disconnect();
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('reveal-visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('#dayContent .reveal').forEach(el => revealObserver.observe(el));
}

function changeDay(newKey){
  window.scrollTo({top:0,behavior:'smooth'});
  const wrap = document.getElementById('dayContent');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) { activeDay = newKey; render(); return; }
  wrap.classList.add('day-fade-out');
  setTimeout(() => {
    activeDay = newKey;
    render();
    wrap.classList.remove('day-fade-out');
  }, 150);
}

function renderBottomNav(){
  const idx = dayData.findIndex(d => d.key === activeDay);
  const d = dayData[idx];
  document.getElementById('bottomNavDay').textContent = `DÍA ${d.num}`;
  document.getElementById('bottomNavDate').textContent = DATES[d.key] ? DATES[d.key].short : '';
  const prevBtn = document.getElementById('prevDayBtn');
  const nextBtn = document.getElementById('nextDayBtn');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === dayData.length - 1;
  prevBtn.onclick = () => { if (idx > 0) changeDay(dayData[idx-1].key); };
  nextBtn.onclick = () => { if (idx < dayData.length-1) changeDay(dayData[idx+1].key); };
}

function render(){
  renderHotels();
  renderDay();
  renderBottomNav();
  renderDayMap(dayData.find(x => x.key === activeDay));
}

async function initApp(){
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    mapboxgl.accessToken = cfg.mapboxToken || '';
  } catch (err) {
    console.error('No se pudo cargar la configuración de Mapbox', err);
  }
  render();
}
initApp();
