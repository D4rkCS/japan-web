name: Aplicar itinerario optimizado una vez

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'feat: integrate optimized itinerary' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar archivos
        run: |
          test -f ITINERARIO-OPTIMIZADO.md
          test -f public/index.html
          echo "Archivos encontrados"

      - name: Marcar version optimizada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- OPTIMIZED_ITINERARY_2026 -->'
          if marker not in s:
              s = s.replace('<script>\nconst dayData = [', '<script>\n' + marker + '\nconst dayData = [', 1)
              p.write_text(s, encoding='utf-8')
          print('Version optimizada marcada correctamente')
          PY

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate optimized itinerary"
          git push
