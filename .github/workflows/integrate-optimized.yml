name: Integrar itinerario optimizado

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'feat: integrate optimized itinerary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar horarios del itinerario
        env:
          STEPS_JSON: >-
            {"d1":[["14:15","Aterrizaje en Narita — vuelo IAH → NRT, Terminal 1, ~2:15 PM"],["14:55","Migración y aduana — revisión de pasaporte y equipaje"],["15:25","Retiro de efectivo — cajero automático en el aeropuerto"],["15:40","Suica card y eSIM — tarjeta de transporte y datos móviles"],["15:55","Keisei Access Express a Asakusa — directo, sin transbordos, ~55 min"],["16:50","Check-in en Asakusa — descanso breve"],["17:55","Senso-ji de noche — paseo por el recinto exterior"],["18:45","Kaminarimon iluminada y Nakamise-dori"],["19:45","Cena en Kirby Café — solo con reserva confirmada"],["21:30","Skytree desde lejos + paseo por Sumida"],["22:30","Konbini / Don Quijote y regreso al hotel"]],"d2":[["08:00","Salida hacia Akihabara"],["08:30","BicCamera + Book-Off + tiendas principales"],["10:15","Regreso a Asakusa"],["10:30","Senso-ji + Asakusa Jinja + goshuin"],["12:00","Ueno Park + Shinobazu + Ueno Toshogu"],["14:00","Comida y regreso a Asakusa"],["16:00","Tokyo Skytree"],["18:00","Sumida / Nakamise / Denboin"],["19:30","Cena en Asakusa"],["21:00","Arcade / gachapon opcional"]],"d3":[["06:30","Salida de Asakusa"],["08:00","Kamakura"],["08:15","Kotoku-in / Gran Buda"],["09:30","Hase-dera"],["10:45","Tsurugaoka Hachimangu"],["12:00","Komachi-dori + comida"],["13:00","Yuigahama / traslado"],["13:30","Enoden hacia Enoshima"],["14:00","Enoshima: santuario, calles y miradores"],["17:30","Traslado a Yokohama"],["18:30","Minato Mirai + Chinatown"],["20:30","Regreso a Asakusa"]],"d4":[["06:15","Salida hacia Shinjuku"],["07:00","Bus a Kawaguchiko / Fuji-Q"],["09:00","Fuji-Q Highland — atracciones prioritarias"],["14:00","Traslado a Kawaguchiko"],["14:30","Lago Kawaguchiko / Oishi Park"],["15:45","Kachi Kachi Ropeway si el clima acompaña"],["17:00","Regreso a la estación de Kawaguchiko"],["17:30","Hoto para cenar"],["18:30","Regreso a Tokio"]],"d5":[["07:30","Desayuno y preparación"],["08:00","Check-out en Asakusa"],["08:15","Salida hacia Tokyo Station"],["09:00","Shinkansen a Shin-Osaka"],["11:30","Llegada a Shin-Osaka"],["12:00","Traslado a Katsuo-ji"],["13:00","Katsuo-ji"],["15:30","Llegada/check-in en Osaka"],["16:30","Namba / Dotonbori / Shinsaibashi"],["18:30","Umeda Sky Building si hay energía y buen clima"],["20:00","Kuromon / Dotonbori"],["21:00","Glico + crucero Dotonbori si hay reserva"]],"d6":[["06:00","Salida hacia Nara"],["07:00","Nara Park"],["08:00","Todai-ji"],["09:15","Kasuga Taisha"],["10:15","Kofuku-ji si el ritmo lo permite"],["11:00","Nakatanidou + comida"],["12:00","Regreso a Osaka"],["13:00","Castillo de Osaka y jardines"],["15:00","Shinsekai"],["16:30","Dotonbori / Shinsaibashi"],["19:00","Cena y noche libre en Osaka"]],"d7":[["Antes de apertura","Llegar temprano a Universal Studios Japan"],["Apertura","Super Nintendo World — prioridad 1"],["Después","Harry Potter — prioridad 2"],["Mediodía","Jurassic Park / Minion Park / comida"],["Tarde","Atracciones favoritas y espectáculos"],["Noche","CityWalk / cena / regreso al hotel"]],"d8":[["08:00","Check-out en Osaka"],["08:30","Tren Osaka → Kioto"],["09:15","Dejar equipaje en el hotel"],["10:00","Kiyomizu-dera"],["11:30","Sannenzaka / Ninenzaka"],["13:00","Comida"],["14:00","Higashiyama / Yasaka Pagoda"],["16:00","Yasaka / Gion"],["17:00","Pokémon Center Kyoto"],["18:30","Kyoto Station / Kyoto Tower"],["20:00","Cena y descanso"]],"d9":[["07:00","Arashiyama"],["07:15","Bamboo Forest"],["08:15","Tenryu-ji"],["09:30","Togetsukyo"],["10:00","Otagi Nenbutsu-ji"],["11:15","Iwatayama Monkey Park"],["13:00","Comida en Arashiyama"],["13:45","Salida hacia Kioto / Uji"],["15:00","Llegada a la zona del Museo Nintendo"],["16:00","Museo Nintendo — entrada con horario fijo"],["Hasta cierre","Museo + tienda/café"],["Noche","Regreso a Kioto"]],"d10":[["07:00","Fushimi Inari"],["10:00","Snacks / inarizushi"],["11:00","Traslado a Kinkaku-ji"],["12:00","Kinkaku-ji + jardines"],["14:00","Regreso al centro"],["15:00","Nishiki Market"],["17:00","Paseo por Kamo"],["Noche","Cena en Kioto"]],"d11":[["06:30","Salida Kioto → Hiroshima"],["08:15","Genbaku Dome"],["08:45","Peace Memorial Park"],["09:30","Peace Memorial Museum"],["11:15","Hiroshima Castle / exterior"],["12:00","Okonomiyaki / comida"],["13:00","Tren + ferry a Miyajima"],["14:00","Itsukushima Shrine"],["15:00","Omotesando + momiji manju"],["15:45","Daisho-in"],["17:00","Paseo por Miyajima / marea / fotos"],["18:00","Regreso a Hiroshima"],["19:00","Cena"],["20:30","Shinkansen a Kioto"]],"d12":[["07:30","Desayuno"],["08:00","Check-out en Kioto"],["08:30","Shinkansen Kioto → Tokio"],["11:00","Palacio Imperial / zona exterior"],["12:00","Traslado a Machida"],["13:00","Snoopy Museum"],["14:30","PEANUTS Café si la reserva encaja"],["15:30","Regreso a Tokio"],["16:30","Check-in en el hotel"],["17:30","Ikebukuro / Sunshine City opcional"],["19:00","Shinjuku"],["19:30","Omoide Yokocho"],["20:15","Kabukicho / gato 3D"],["21:00","Golden Gai"],["22:00","Regreso al hotel"]],"d13":[["08:30","Akihabara"],["08:30","Tiendas de anime/electrónica"],["11:00","teamLab Borderless — entrada con reserva"],["13:00","Azabudai / comida"],["14:00","Tokyo City View / Roppongi opcional"],["15:30","Pokémon Café Nihonbashi solo con reserva"],["17:00","Odaiba"],["17:30","Gundam"],["18:00","Rainbow Bridge / bahía"],["19:00","Regreso a Akihabara"],["Noche","Arcades / tiendas / maid café"]],"d14":[["Mañana","teamLab Planets — según hora reservada"],["12:00","Mundo Pixar — según hora reservada"],["14:00","Traslado a Harajuku"],["14:45","Meiji Jingu"],["16:00","Takeshita-dori"],["17:00","Harajuku → Shibuya"],["18:00","Shibuya Crossing / Hachiko"],["18:30","Shibuya Sky — según reserva"],["20:00","Cena en Shibuya"]],"d15":[["09:00","Jindaiji, Chofu"],["11:30","Soba tradicional"],["13:00","Regreso a Tokio"],["14:00","Últimas compras"],["16:00","Repetir el lugar favorito del viaje"],["18:00","Última comida especial"],["19:30","Empacar"],["20:00","Preparar equipaje para Narita"],["Noche","Paseo tranquilo y dormir temprano"]],"d16":[["06:00","Desayuno y check-out"],["06:30","Salida del hotel con margen"],["07:00","Keisei Skyliner desde Nippori/Ueno hacia Narita si el hotel queda en esa zona"],["08:00","Objetivo: estar en Narita alrededor de las 08:00–08:30"],["08:30","Check-in / equipaje / seguridad / migración"],["10:00","Duty-free + puerta de embarque"],["11:30","Vuelo Narita → Houston"]]}
        run: python - <<'PY'
import json, os, re
from pathlib import Path
p = Path('public/index.html')
s = p.read_text(encoding='utf-8')
steps = json.loads(os.environ['STEPS_JSON'])
for key, new_steps in steps.items():
    obj = re.search(r"\{ key: '" + re.escape(key) + r"'.*?(?=\n    \{ key: 'd\d+\'|\n\];\n\nfunction|\n\];\n\nconst|\n\];\n)", s, re.S)
    if not obj:
        raise SystemExit(f'No se encontró {key}')
    block = obj.group(0)
    m = re.search(r"steps: \[.*?\n      \],\n      route:", block, re.S)
    if not m:
        raise SystemExit(f'No se encontró steps de {key}')
    lines = ['steps: [']
    for t, desc in new_steps:
        lines.append(f"        [{json.dumps(t, ensure_ascii=False)}, {json.dumps(desc, ensure_ascii=False)}],")
    lines.append('      ],\n      route:')
    replacement = '\n'.join(lines)
    new_block = block[:m.start()] + replacement + block[m.end():]
    s = s[:obj.start()] + new_block + s[obj.end():]
p.write_text(s, encoding='utf-8')
print('Actualizados:', ', '.join(steps))
PY

      - name: Validar cambios
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('public/index.html').read_text(encoding='utf-8')
          assert "['06:30', 'Salida de Asakusa']" in s
          assert "['06:30', 'Salida Kioto → Hiroshima']" in s
          assert "['07:00', 'Keisei Skyliner desde Nippori/Ueno hacia Narita si el hotel queda en esa zona']" in s
          print('Validación OK')
          PY

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/integrate-optimized.yml
          git commit -m "feat: integrate optimized itinerary" || exit 0
          git push
